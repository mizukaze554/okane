name: Check
on:
  push:
    branches: [main, feat/smart-finance-and-automation]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - run: node --check src/app.js && node --check src/finance.js && node --check src/storage.js
